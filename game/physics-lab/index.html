<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHYSICS LAB — Phase 3</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/styles/style.css">
<!--
  配信方式: site リポジトリの既存ルール（ビルドなし静的ファイル）に合わせ、
  依存ライブラリはバージョン固定の CDN から ES Modules で読み込む。
  ローカル開発では `npm install && npm run dev`（Vite）でも同じソースが動く。
  その場合 Vite が node_modules から解決するため importmap は使われない。
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div id="hud-title">
      <div class="hud-game-name">PHYSICS LAB</div>
      <div class="hud-phase">STAGE: TEST LAB — PHASE 3 (GIMMICKS)</div>
      <div id="hud-progress">CHECKPOINT 1 / 4</div>
      <div id="hud-debug">initializing…</div>
    </div>
    <div id="hud-status">
      <div class="hud-status-row"><span class="hud-status-label">TIME</span><span id="hud-time">00:00.0</span></div>
      <div class="hud-status-row"><span class="hud-status-label">RESPAWN</span><span id="hud-respawn">0</span></div>
    </div>
    <div id="hud-boost">
      <div id="hud-boost-label">BOOST (Shift)</div>
      <div id="hud-boost-bar"><div id="hud-boost-fill"></div></div>
    </div>
    <div id="hud-controls">
      WASD / 矢印キー: 移動 &nbsp; Space: ジャンプ &nbsp; Shift: ブースト &nbsp; R: リスポーン &nbsp; Esc / P: ポーズ &nbsp; マウス: 視点
    </div>
    <div id="hud-notify"></div>
    <div id="hud-hint">クリックで視点ロック（マウス視点）<br><span class="hud-hint-sub">ロックしなくても WASD で移動できます</span></div>
    <div id="hud-loading">実験施設を初期化しています…</div>
    <div id="hud-error" hidden></div>
  </div>

  <div id="pause-menu" hidden>
    <div class="pause-panel">
      <div class="pause-title">PAUSED</div>
      <button id="pause-resume" type="button">再開する（Esc / P）</button>
      <button id="pause-respawn" type="button">チェックポイントから再開</button>
      <div class="pause-note">ポーズ中はタイマーと物理演算が止まります</div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
