<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#91b7c2">
<title>THE LIVING WORLD | 文明シミュレーション</title>
<link rel="stylesheet" href="./prototype-3d.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div id="view" aria-label="3Dで描画された文明の世界"></div>
<div class="hud">
 <div class="panel"><div class="brand">THE LIVING WORLD</div><div class="sub">A WORLD THAT GROWS · 3D SANDBOX</div><div id="mode">観察モード — まだ小さな村の世界</div></div>
 <div class="panel stats"><div>人口<b id="population">24</b></div><div>集落<b id="settlements">1</b></div><div>時代<b>黎明期</b></div></div>
</div>
<div id="clock">WORLD TIME · 00:00</div>
<div id="credit">PROCEDURAL LANDSCAPE · EARLY CONCEPT</div>
<div class="controls">
 <div class="panel help">左ドラッグ：回転　／　右ドラッグ：平行移動　／　ホイール：ズーム<br>ダブルクリック：村へ戻る　／　Q・E：回転</div>
 <div class="panel buttons"><button id="home">村を見る</button><button id="rotate">自動回転：OFF</button><button id="pause">時間：停止</button></div>
</div>
<script type="module" src="./prototype-3d.js"></script>
</body></html>
